[package]
name = "ferrideck"
version = "0.1.0"
edition = "2024"
description = "Spaced repetition flashcards for language learning, built in Rust"
license = "MIT"
repository = "https://github.com/cvieirasp/ferrideck"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
eframe = "0.35.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
uuid = { version = "1.24.0", features = ["v4"] }
